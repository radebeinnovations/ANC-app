<script>
        // Simple script to handle preset chip selection UI update
        document.addEventListener('DOMContentLoaded', () => {
            const amountInput = document.getElementById('amount');
            const chips = document.querySelectorAll('button:not(.bg-primary)');
            const activeChipClass = ['border-primary', 'bg-primary', 'text-on-primary', 'shadow-sm'];
            const inactiveChipClass = ['border-surface-border', 'bg-surface-container-lowest', 'text-on-surface', 'hover:border-primary', 'hover:text-primary'];

            chips.forEach(chip => {
                if(chip.textContent.startsWith('R') && !chip.querySelector('span')) {
                    chip.addEventListener('click', function() {
                        // Reset all chips
                        document.querySelectorAll('button:not(.w-full):not(.p-2)').forEach(c => {
                            if(c.textContent.startsWith('R') && !c.querySelector('span')) {
                                c.classList.remove(...activeChipClass);
                                c.classList.add(...inactiveChipClass);
                            }
                        });

                        // Set active
                        this.classList.remove(...inactiveChipClass);
                        this.classList.add(...activeChipClass);

                        // Update input
                        const val = this.textContent.replace('R', '');
                        amountInput.value = val + '.00';
                    });
                }
            });

            // Radio button styling update
            const radios = document.querySelectorAll('input[type="radio"][name="speed"]');
            radios.forEach(radio => {
                radio.addEventListener('change', (e) => {
                    document.querySelectorAll('label.cursor-pointer').forEach(label => {
                        label.classList.remove('border-2', 'border-primary');
                        label.classList.add('border', 'border-surface-border');
                        const bgOverlay = label.querySelector('.absolute');
                        if(bgOverlay) bgOverlay.remove();
                    });

                    const activeLabel = e.target.closest('label');
                    activeLabel.classList.remove('border', 'border-surface-border');
                    activeLabel.classList.add('border-2', 'border-primary');
                    
                    if(!activeLabel.querySelector('.absolute')) {
                        const overlay = document.createElement('div');
                        overlay.className = 'absolute inset-0 bg-primary opacity-5 pointer-events-none';
                        activeLabel.insertBefore(overlay, activeLabel.firstChild);
                    }
                });
            });
        });
    </script>
