    body {
      min-height: max(884px, 100dvh);

<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col">
<!-- Top Navigation (Transactional intent -> no bottom nav, customized top app bar for flow) -->
<header class="bg-surface w-full top-0 sticky border-b border-surface-border flex justify-between items-center px-container-margin h-16 w-full z-50">
<button class="flex items-center text-on-surface-variant hover:bg-surface-container-low transition-colors p-2 rounded-full active:scale-95 duration-150">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="text-center">
<h1 class="font-headline-md text-headline-md font-bold text-primary">Send Money</h1>
<p class="font-label-sm text-label-sm text-text-secondary">STEP 2 OF 3</p>
</div>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<main class="flex-grow flex flex-col max-w-3xl mx-auto w-full md:px-container-margin py-stack-md">
<!-- Recipient Card -->
<section class="px-container-margin md:px-0 mb-stack-lg">
<div class="bg-surface-container-lowest border border-surface-border rounded-xl p-4 flex items-center shadow-sm">
<div class="w-12 h-12 bg-surface-container rounded-full flex items-center justify-center mr-4 text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">person</span>
</div>
<div>
<h2 class="font-label-md text-label-md text-on-surface">Thabo Mokoena</h2>
<p class="font-body-md text-body-md text-text-secondary">+27 82 123 4567</p>
</div>
</div>
</section>
<!-- Amount Input Area -->
<section class="px-container-margin md:px-0 flex flex-col items-center mb-stack-lg relative">
<label class="sr-only" for="amount">Amount to send</label>
<div class="flex items-end justify-center mb-2">
<span class="font-headline-md text-headline-md text-text-secondary mr-2 mb-1">R</span>
<input autofocus="" class="bg-transparent border-none p-0 text-center font-display-lg text-display-lg text-primary focus:ring-0 w-full max-w-[250px] outline-none" id="amount" type="text" value="500.00"/>
</div>
<p class="font-body-md text-body-md text-text-secondary">Available Balance: R1,500.00</p>
<div class="w-24 h-1 bg-surface-container-high rounded-full mt-4">
<div class="w-1/3 h-full bg-primary rounded-full"></div>
</div>
</section>
<!-- Quick Amount Pills -->
<section class="px-container-margin md:px-0 mb-stack-lg">
<div class="flex flex-wrap gap-2 justify-center">
<button class="px-4 py-2 bg-surface-container-lowest border border-surface-border rounded-full font-label-md text-label-md text-on-surface hover:bg-surface-container-low transition-colors">R50</button>
<button class="px-4 py-2 bg-surface-container-lowest border border-surface-border rounded-full font-label-md text-label-md text-on-surface hover:bg-surface-container-low transition-colors">R100</button>
<button class="px-4 py-2 bg-surface-container-lowest border border-surface-border rounded-full font-label-md text-label-md text-on-surface hover:bg-surface-container-low transition-colors">R200</button>
<button class="px-4 py-2 bg-primary border border-primary rounded-full font-label-md text-label-md text-on-primary hover:bg-primary-container transition-colors shadow-sm">R500</button>
<button class="px-4 py-2 bg-surface-container-lowest border border-surface-border rounded-full font-label-md text-label-md text-on-surface hover:bg-surface-container-low transition-colors">R1,000</button>
</div>
</section>
<!-- Transfer Info & Note -->
<section class="px-container-margin md:px-0 mb-stack-lg flex-grow">
<div class="bg-surface-container-low rounded-xl p-4 mb-stack-md">
<div class="flex justify-between items-center mb-2">
<span class="font-body-md text-body-md text-text-secondary">Transfer Fee:</span>
<span class="font-label-md text-label-md text-on-surface">R5.00</span>
</div>
<div class="flex justify-between items-center">
<span class="font-body-md text-body-md text-text-secondary">Arrival:</span>
<span class="font-label-md text-label-md text-status-active flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">bolt</span> Instant
                    </span>
</div>
</div>
<div class="w-full">
<label class="sr-only" for="note">Add a note (optional)</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-text-secondary">edit_note</span>
</div>
<input class="w-full pl-10 pr-3 py-3 bg-surface-container-lowest border border-surface-border rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all" id="note" placeholder="Add a note (optional)" type="text"/>
</div>
</div>
</section>
<!-- Action Button -->
<section class="px-container-margin md:px-0 mt-auto pb-stack-md pt-4">
<button class="w-full bg-primary text-on-primary font-label-md text-label-md h-12 rounded-lg flex items-center justify-center gap-2 hover:bg-primary-container active:scale-[0.98] transition-all shadow-sm">
                Review Transfer
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
</section>
</main>
</body></html>
