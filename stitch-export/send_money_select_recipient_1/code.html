<body class="bg-background text-on-background font-body-md h-screen flex flex-col md:items-center md:pt-10">

<div class="h-1 flex-1 bg-primary rounded-full"></div>
<div class="h-1 flex-1 bg-surface-container-high rounded-full"></div>
<div class="h-1 flex-1 bg-surface-container-high rounded-full"></div>
</div>
<p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-2">STEP 1 OF 3</p>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg mb-stack-lg">Choose a recipient</h2>
<!-- Search Bar -->
<div class="relative mb-stack-lg">
<span class="material-symbols-outlined absolute left-3 top-1/2 transform -translate-y-1/2 text-on-surface-variant" data-icon="search">search</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-lowest border border-surface-border rounded-xl focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary font-body-md text-on-surface placeholder-on-surface-variant transition-all" placeholder="Search by name, phone number or account" type="text"/>
</div>
<!-- Manual Entry Option -->
<button class="w-full flex items-center p-4 mb-stack-lg bg-surface-container-lowest border border-surface-border rounded-xl hover:bg-surface-container-low transition-colors text-left group">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center mr-4 group-hover:bg-surface-container-high transition-colors text-primary">
<span class="material-symbols-outlined" data-icon="add">add</span>
</div>
<div>
<p class="font-label-md text-label-md text-on-surface">Enter details manually</p>
<p class="font-label-sm text-label-sm text-on-surface-variant">Send to a new contact</p>
</div>
</button>
<!-- Recent Recipients Section -->
<h3 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider mb-stack-sm">Recent</h3>
<div class="space-y-3">

<div class="w-12 h-12 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center font-label-md text-label-md">

                        </div>
<div class="absolute -bottom-1 -right-1 bg-surface rounded-full p-0.5 shadow-sm">
<span class="material-symbols-outlined text-[16px] text-status-active" data-icon="verified" data-weight="fill" style="font-variation-settings: 'FILL' 1;">verified</span>
</div>
</div>
<div class="flex-1">
<p class="font-label-md text-label-md text-on-surface">Thabo Mokoena</p>
<p class="font-label-sm text-label-sm text-on-surface-variant">+27 82 123 4567</p>
</div>
<div class="flex flex-col items-end">
<span class="text-[10px] font-semibold text-status-active tracking-wide uppercase">ANC Member</span>
</div>
</button>

</div>

<!-- Fixed Bottom Action -->
<div class="absolute bottom-0 left-0 w-full p-container-margin bg-surface bg-opacity-90 backdrop-blur-sm border-t border-surface-border z-20 pb-safe">
<button class="w-full h-12 bg-surface-container-high text-on-surface-variant font-label-md text-label-md rounded-full flex items-center justify-center cursor-not-allowed opacity-70 transition-all" disabled="">
                Continue
            </button>
</div>

<!-- Script to simulate basic interaction for the disabled button state -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const recipientButtons = document.querySelectorAll('.space-y-3 button');
            const continueButton = document.querySelector('.absolute.bottom-0 button');

            recipientButtons.forEach(button => {
                button.addEventListener('click', () => {
                    // Reset all
                    recipientButtons.forEach(btn => btn.classList.remove('ring-2', 'ring-primary', 'bg-surface-container-low'));
                    
                    // Highlight selected
                    button.classList.add('ring-2', 'ring-primary', 'bg-surface-container-low');
                    
                    // Enable continue button
                    continueButton.removeAttribute('disabled');
                    continueButton.classList.remove('bg-surface-container-high', 'text-on-surface-variant', 'cursor-not-allowed', 'opacity-70');
                    continueButton.classList.add('bg-primary', 'text-on-primary', 'hover:bg-primary-fixed-variant');
                });
            });
        });
    </script>
