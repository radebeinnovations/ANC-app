<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>ANC - Sign In</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "background": "#f9f9f9",
                        "on-primary-fixed": "#00210c",
                        "primary": "#006933",
                        "anc-green-dark": "#006432",
                        "surface-container-highest": "#e2e2e2",
                        "surface-variant": "#e2e2e2",
                        "on-tertiary-fixed-variant": "#474747",
                        "surface-border": "#E2E8F0",
                        "on-surface-variant": "#3e4a3f",
                        "on-error": "#ffffff",
                        "secondary-container": "#fecc00",
                        "anc-gold-muted": "#E5B800",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-high": "#e8e8e8",
                        "tertiary-fixed-dim": "#c6c6c6",
                        "on-primary": "#ffffff",
                        "on-background": "#1a1c1c",
                        "on-secondary-fixed-variant": "#574500",
                        "on-error-container": "#93000a",
                        "text-secondary": "#4A5568",
                        "error": "#ba1a1a",
                        "on-tertiary-fixed": "#1b1b1b",
                        "primary-fixed-dim": "#71dc8e",
                        "surface-bright": "#f9f9f9",
                        "inverse-surface": "#2f3131",
                        "error-container": "#ffdad6",
                        "outline": "#6e7a6e",
                        "primary-container": "#008542",
                        "outline-variant": "#bdcabc",
                        "on-primary-fixed-variant": "#005226",
                        "secondary": "#735c00",
                        "surface-container": "#eeeeee",
                        "surface": "#f9f9f9",
                        "on-secondary-container": "#6e5700",
                        "surface-tint": "#006d35",
                        "secondary-fixed": "#ffe089",
                        "inverse-primary": "#71dc8e",
                        "tertiary-container": "#737373",
                        "tertiary-fixed": "#e2e2e2",
                        "tertiary": "#5a5a5a",
                        "on-surface": "#1a1c1c",
                        "surface-dim": "#dadada",
                        "secondary-fixed-dim": "#f0c100",
                        "on-secondary-fixed": "#241a00",
                        "primary-fixed": "#8df9a8",
                        "on-primary-container": "#eeffec",
                        "on-secondary": "#ffffff",
                        "inverse-on-surface": "#f1f1f1",
                        "on-tertiary": "#ffffff",
                        "status-active": "#008542",
                        "surface-container-low": "#f3f3f3",
                        "on-tertiary-container": "#fafafa"
                    },
                    borderRadius: {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    spacing: {
                        "gutter": "16px",
                        "unit": "8px",
                        "stack-md": "16px",
                        "stack-sm": "8px",
                        "container-margin": "20px",
                        "stack-lg": "32px"
                    },
                    fontFamily: {
                        "headline-lg-mobile": ["Hanken Grotesk"],
                        "headline-md": ["Hanken Grotesk"],
                        "label-sm": ["Inter"],
                        "headline-lg": ["Hanken Grotesk"],
                        "body-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "display-lg": ["Hanken Grotesk"],
                        "body-md": ["Inter"]
                    },
                    fontSize: {
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Custom styles for segment control */
        input[type="radio"]:checked + label {
            background-color: theme('colors.primary');
            color: theme('colors.on-primary');
            border-color: theme('colors.primary');
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col md:bg-surface-container md:items-center md:justify-center">
<!-- Top App Bar (Only visible on Mobile, as per standard transactional screen logic, though often suppressed entirely on pure login. We keep a minimal header for brand presence) -->
<header class="fixed top-0 w-full z-50 flex items-center justify-between px-container-margin h-16 bg-surface md:hidden border-b border-surface-border">
<div class="flex items-center gap-unit">
<span class="material-symbols-outlined text-primary text-2xl" data-weight="fill" style="font-variation-settings: 'FILL' 1;">arrow_back</span>
</div>
<h1 class="font-headline-md text-headline-md-mobile font-bold text-primary">ANC</h1>
<div class="w-6 h-6"></div> <!-- Spacer -->
</header>
<!-- Main Content Container (Card on Desktop, Full screen on Mobile) -->
<main class="flex-1 w-full flex flex-col pt-20 px-container-margin pb-stack-lg md:pt-stack-lg md:max-w-md md:bg-surface-container-lowest md:rounded-xl md:shadow-sm md:border md:border-surface-border md:min-h-min">
<!-- Header Section -->
<div class="mb-stack-lg md:text-center mt-stack-md md:mt-0">
<div class="hidden md:flex justify-center mb-stack-md">
<div class="w-16 h-16 bg-surface-container rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-4xl" style="font-variation-settings: 'FILL' 1;">account_circle</span>
</div>
</div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-background mb-unit">Welcome Back</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to your ANC Member account.</p>
</div>
<!-- Segmented Control -->
<div class="flex p-1 bg-surface-container rounded-lg mb-stack-lg border border-surface-border">
<div class="flex-1 relative">
<input checked="" class="sr-only" id="loginTypeMembership" name="loginType" type="radio"/>
<label class="block w-full text-center py-2 rounded-md font-label-md text-label-md cursor-pointer transition-colors text-on-surface-variant hover:bg-surface-variant" for="loginTypeMembership">
                    Membership Number
                </label>
</div>
<div class="flex-1 relative">
<input class="sr-only" id="loginTypePhone" name="loginType" type="radio"/>
<label class="block w-full text-center py-2 rounded-md font-label-md text-label-md cursor-pointer transition-colors text-on-surface-variant hover:bg-surface-variant" for="loginTypePhone">
                    Phone Number
                </label>
</div>
</div>
<!-- Form Section -->
<form class="flex flex-col gap-stack-md flex-1 md:flex-none">
<!-- Dynamic Input Group (Membership Number) -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-md text-label-md text-on-background" for="identifier">Membership Number</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none material-symbols-outlined text-on-surface-variant">badge</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary font-body-md text-body-md text-on-background transition-shadow" id="identifier" placeholder="e.g. 12345678" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-md text-label-md text-on-background" for="password">Password</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none material-symbols-outlined text-on-surface-variant">lock</span>
<input class="w-full pl-10 pr-12 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary font-body-md text-body-md text-on-background transition-shadow" id="password" placeholder="Enter your password" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-on-surface-variant hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined" id="togglePassword">visibility_off</span>
</button>
</div>
</div>
<!-- Form Options -->
<div class="flex items-center justify-between mt-stack-sm">
<label class="flex items-center gap-2 cursor-pointer">
<input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary bg-surface-container-lowest" type="checkbox"/>
<span class="font-body-md text-body-md text-on-surface-variant">Remember me</span>
</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">Forgot Password?</a>
</div>
<!-- Spacer to push actions to bottom on mobile -->
<div class="flex-1 md:hidden"></div>
<!-- Actions -->
<div class="flex flex-col gap-stack-md mt-stack-lg md:mt-stack-md">
<button class="w-full py-4 bg-primary text-on-primary rounded-lg font-label-md text-label-md hover:bg-primary-container active:scale-[0.98] transition-all flex items-center justify-center gap-2 shadow-sm" type="submit">
                    Sign In
                    <span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
<button class="w-full py-4 bg-surface-container-lowest border border-surface-border text-on-background rounded-lg font-label-md text-label-md hover:bg-surface-container active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="button">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">fingerprint</span>
                    Biometric Login
                </button>
</div>
</form>
<!-- Footer Links -->
<div class="mt-stack-lg pt-stack-md border-t border-surface-border text-center flex flex-col gap-stack-sm">
<p class="font-body-md text-body-md text-on-surface-variant">
                New to ANC Member? 
                <a class="font-label-md text-label-md text-primary hover:underline" href="#">Join the ANC</a>
</p>
<a class="font-label-md text-label-md text-on-surface-variant hover:text-on-background transition-colors inline-flex items-center justify-center gap-1 mx-auto mt-2" href="#">
                Continue as Guest
                <span class="material-symbols-outlined text-sm">chevron_right</span>
</a>
</div>
</main>
<script>
        // Simple password toggle logic
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        if(togglePassword && passwordInput) {
            togglePassword.parentElement.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                togglePassword.textContent = type === 'password' ? 'visibility_off' : 'visibility';
            });
        }

        // Segment logic update UI placeholder
        const loginTypePhone = document.getElementById('loginTypePhone');
        const loginTypeMembership = document.getElementById('loginTypeMembership');
        const identifierLabel = document.querySelector('label[for="identifier"]');
        const identifierInput = document.getElementById('identifier');
        const identifierIcon = identifierInput.previousElementSibling;

        loginTypePhone.addEventListener('change', () => {
            if(loginTypePhone.checked) {
                identifierLabel.textContent = 'Phone Number';
                identifierInput.placeholder = 'e.g. 082 123 4567';
                identifierIcon.textContent = 'phone_iphone';
            }
        });

        loginTypeMembership.addEventListener('change', () => {
            if(loginTypeMembership.checked) {
                identifierLabel.textContent = 'Membership Number';
                identifierInput.placeholder = 'e.g. 12345678';
                identifierIcon.textContent = 'badge';
            }
        });
    </script>
</body></html>
