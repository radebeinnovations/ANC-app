<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Review Transfer</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-primary": "#71dc8e",
                        "surface-container-highest": "#e2e2e2",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-container": "#6e5700",
                        "anc-gold-muted": "#E5B800",
                        "primary": "#006933",
                        "tertiary-container": "#737373",
                        "on-surface-variant": "#3e4a3f",
                        "anc-green-dark": "#006432",
                        "secondary-container": "#fecc00",
                        "surface": "#f9f9f9",
                        "on-secondary-fixed": "#241a00",
                        "tertiary-fixed-dim": "#c6c6c6",
                        "inverse-on-surface": "#f1f1f1",
                        "on-tertiary": "#ffffff",
                        "on-secondary": "#ffffff",
                        "on-error-container": "#93000a",
                        "error-container": "#ffdad6",
                        "background": "#f9f9f9",
                        "tertiary": "#5a5a5a",
                        "surface-container": "#eeeeee",
                        "status-active": "#008542",
                        "secondary-fixed": "#ffe089",
                        "on-primary": "#ffffff",
                        "surface-dim": "#dadada",
                        "outline": "#6e7a6e",
                        "on-tertiary-fixed": "#1b1b1b",
                        "text-secondary": "#4A5568",
                        "on-primary-fixed-variant": "#005226",
                        "on-error": "#ffffff",
                        "outline-variant": "#bdcabc",
                        "surface-container-high": "#e8e8e8",
                        "primary-fixed": "#8df9a8",
                        "inverse-surface": "#2f3131",
                        "surface-bright": "#f9f9f9",
                        "surface-border": "#E2E8F0",
                        "on-secondary-fixed-variant": "#574500",
                        "on-background": "#1a1c1c",
                        "surface-container-low": "#f3f3f3",
                        "on-primary-fixed": "#00210c",
                        "tertiary-fixed": "#e2e2e2",
                        "primary-container": "#008542",
                        "on-tertiary-fixed-variant": "#474747",
                        "on-primary-container": "#eeffec",
                        "on-tertiary-container": "#fafafa",
                        "surface-tint": "#006d35",
                        "primary-fixed-dim": "#71dc8e",
                        "secondary-fixed-dim": "#f0c100",
                        "on-surface": "#1a1c1c",
                        "surface-variant": "#e2e2e2",
                        "error": "#ba1a1a",
                        "secondary": "#735c00"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "stack-md": "16px",
                        "unit": "8px",
                        "stack-sm": "8px",
                        "gutter": "16px",
                        "container-margin": "20px",

                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],

                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],

                },
            },

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col md:items-center md:justify-center">
<!-- Top App Bar (Hidden on Desktop, Visible on Mobile for Context) -->
<header class="md:hidden flex justify-between items-center w-full px-container-margin py-unit bg-surface dark:bg-inverse-surface border-b border-outline-variant dark:border-outline top-0 z-50 sticky">
<div class="flex items-center gap-unit">
<span class="material-symbols-outlined text-primary" data-icon="arrow_back">arrow_back</span>
<h1 class="font-headline-md text-headline-md font-bold text-primary">Review Transfer</h1>
</div>
<span class="material-symbols-outlined text-primary" data-icon="help_outline">help_outline</span>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-md mx-auto p-container-margin flex flex-col gap-stack-lg">
<!-- Header / Progress (Desktop) -->
<div class="hidden md:flex flex-col items-center gap-stack-sm pt-stack-lg">
<h1 class="font-headline-lg text-headline-lg font-bold text-primary">Review Details</h1>
<p class="font-body-md text-body-md text-text-secondary">Step 3 of 3</p>
</div>
<!-- Mobile Progress Indicator -->
<div class="md:hidden flex items-center justify-between px-unit pt-stack-sm">
<div class="flex-1 h-1 bg-primary rounded-full"></div>
<div class="flex-1 h-1 bg-primary rounded-full mx-1"></div>
<div class="flex-1 h-1 bg-primary rounded-full"></div>
<span class="font-label-sm text-label-sm text-primary ml-2">Step 3</span>
</div>
<!-- Summary Card -->
<div class="bg-surface-container-lowest border border-surface-border rounded-xl shadow-sm p-stack-md flex flex-col gap-stack-md relative overflow-hidden">
<!-- Subtle Watermark Texture -->
<div class="absolute -top-10 -right-10 opacity-5 pointer-events-none">
<span class="material-symbols-outlined text-[120px]" data-icon="payments">payments</span>
</div>
<!-- Total Highlight -->
<div class="flex flex-col items-center justify-center p-stack-md bg-surface-container-low rounded-lg border border-outline-variant">
<span class="font-label-md text-label-md text-text-secondary">Total to Send</span>
<span class="font-display-lg text-display-lg text-primary">R101.50</span>
</div>
<hr class="border-outline-variant"/>
<!-- Detail Rows -->
<div class="flex flex-col gap-unit">
<!-- From Account -->
<div class="flex justify-between items-center py-2">
<span class="font-body-md text-body-md text-text-secondary">From Account</span>
<div class="flex flex-col items-end">
<span class="font-label-md text-label-md text-on-surface">Main Wallet</span>
<span class="font-label-sm text-label-sm text-primary">Balance: R1,500.00</span>
</div>
</div>
<!-- Recipient -->
<div class="flex justify-between items-center py-2">
<span class="font-body-md text-body-md text-text-secondary">Recipient</span>
<div class="flex items-center gap-2">
<div class="w-6 h-6 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center font-label-sm text-label-sm">LT</div>
<span class="font-label-md text-label-md text-on-surface">Lerumo Thabo</span>
</div>
</div>
<!-- Amount -->
<div class="flex justify-between items-center py-2">
<span class="font-body-md text-body-md text-text-secondary">Amount</span>
<span class="font-label-md text-label-md text-on-surface">R100.00</span>
</div>
<!-- Fee -->
<div class="flex justify-between items-center py-2">
<span class="font-body-md text-body-md text-text-secondary">Fee</span>
<span class="font-label-md text-label-md text-on-surface">R1.50</span>
</div>
<!-- Speed -->
<div class="flex justify-between items-center py-2">
<span class="font-body-md text-body-md text-text-secondary">Speed</span>
<span class="font-label-md text-label-md text-status-active flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]" data-icon="bolt">bolt</span>
                        Instant
                    </span>
</div>
</div>
</div>
<!-- Confirmation & Actions -->
<div class="flex flex-col gap-stack-md mt-auto pb-stack-lg md:pb-0">
<label class="flex items-start gap-stack-sm cursor-pointer group">
<div class="relative flex items-center pt-1">
<input class="peer h-5 w-5 rounded border-outline text-primary focus:ring-primary focus:ring-2 bg-surface-container-lowest transition-colors cursor-pointer" id="confirm-checkbox" type="checkbox"/>
</div>
<span class="font-body-md text-body-md text-on-surface pt-1 select-none group-hover:text-primary transition-colors">I confirm these transfer details are correct.</span>
</label>
<button class="w-full h-12 bg-primary text-on-primary font-label-md text-label-md rounded-lg flex items-center justify-center gap-2 hover:bg-anc-green-dark transition-colors opacity-50 cursor-not-allowed" disabled="" id="submit-btn">
                Confirm &amp; Send
                <span class="material-symbols-outlined" data-icon="send">send</span>
</button>
<button class="w-full h-12 bg-transparent text-on-surface font-label-md text-label-md rounded-lg flex items-center justify-center gap-2 border border-outline hover:bg-surface-container transition-colors">
                Cancel
            </button>
</div>
</main>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const checkbox = document.getElementById('confirm-checkbox');
            const submitBtn = document.getElementById('submit-btn');

            checkbox.addEventListener('change', (e) => {
                if(e.target.checked) {
                    submitBtn.disabled = false;
                    submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                } else {
                    submitBtn.disabled = true;
                    submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
                }
            });
        });
    </script>
</body></html>
